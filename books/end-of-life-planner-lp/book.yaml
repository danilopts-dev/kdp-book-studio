reader: Adults 60+ organizing their own affairs, and adult children who buy it for (or fill it in with) an aging parent. Wants big type, wide lines, real room to write and a clear place to start.
positioning: The end-of-life planner for people who write slowly — large print, wide lines and a clear order of where to start, built around four weekends. Individual edition (couples edition is a future SKU).
