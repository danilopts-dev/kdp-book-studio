<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{SUBJECT}}</title></head>
<body style="margin:0;padding:0;background:#f4f4f4;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f4;">
<tr><td align="center" style="padding:24px 12px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:6px;">
<tr><td style="padding:32px 28px;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.55;color:#222222;">
<p style="margin:0 0 16px;">Hi {{ contact.FIRSTNAME | default: "there" }},</p>
<p style="margin:0 0 16px;">{{INTRO}}</p>
<table role="presentation" cellpadding="0" cellspacing="0" style="margin:8px 0 24px;"><tr>
<td style="background:{{BUTTON_COLOR}};border-radius:4px;">
<a href="{{PDF_LINK}}" target="_blank" style="display:inline-block;padding:14px 26px;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:bold;color:#ffffff;text-decoration:none;">{{BUTTON_LABEL}}</a>
</td></tr></table>
<p style="margin:0 0 16px;">{{HOW_TO_USE_1}}</p>
<p style="margin:0 0 16px;">{{HOW_TO_USE_2}}</p>
<p style="margin:0 0 16px;">{{HOW_TO_USE_3}}</p>
<p style="margin:0 0 4px;">{{SIGN_OFF}}</p>
<p style="margin:0 0 20px;">{{SIGNATURE}}</p>
<p style="margin:0;font-size:14px;color:#555555;">P.S. If the link stops working or the file won't open, just reply to this email and I'll send it again.</p>
</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
